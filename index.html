<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset = "UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>merge</title>

  <link rel='stylesheet' href="merge_style.css">
</head>

<body>
	<div class="game-container">
		<div class="viewport-container">
			<div class="container-for-panoram">
				<canvas id="board-canvas" width="2400" height="1600"></canvas>
				<canvas id="item-canvas" width="2400" height="1600"></canvas>
				<canvas id="fog-canvas" width="2400" height="1600"></canvas>
				<canvas id="item-dragging-canvas" width="2400" height="1600"></canvas>
				<canvas id="flyer-canvas" width="2400" height="1600"></canvas>
				<canvas id="flyer-dragging-canvas" width="2400" height="1600"></canvas>
				<canvas id="dragging-canvas" width="2400" height="1600"></canvas>
				<div class="fly-container"></div>
			</div>
		</div>

		<div class="asset-container">
			<div class="gold-counter">
				Gold: <span id="score-gold">0</span>
			</div>
			<div class="wood-counter">
				Wood: <span id="score-wood">0</span>
			</div>
			<div class="crystal-counter">
				Crystal: <span id="score-crystal">0</span>
			</div>
		</div>

		<div class="game-btn-container">
			<button id="btn-flyer-gallery" class="info-btn">FG</button>
		</div>

		<div class="shop-btn">
			<button id="btn-shop">shop</button>
		</div>


		<div class="game-options-container">	
			<div class="shop-container">
				Shop
				<div class="shop"></div>
				<div class="shop-item"></div>

				<div class="shop-flyers">
					<div class="type-flyers"></div>
				</div>
				<div class="flyers-gallery">
					<div class="flyers-gallery-type"></div>
				</div>				

				<button id="btn-back">back</button>
				<button id="btn-exit-shop">exit</button>
			</div>
			<div class="div-info-message">
				<div class="info-message-lacks">
					<h4>Lacks resource</h4>
					<button id="btn-exit-message">exit</button>
				</div>

				<div class="info-message-buy">
					<h4>Buy ?</h4>
					<button id="btn-buy-message">buy</button>
					<button id="btn-no-message">no</button>
				</div>
			</div>	
			<div class="info-container">
				<h4 id="text-for-sale"></h4>
				<div class="info-btn">	
					<button id="btn-remove">yes</button>
					<button id="btn-no">no</button>
				</div>
			</div>
		</div>
	</div>

	<script src="merge_game_config_array.js"></script>
	<script src="merge_items_array.js"></script>
	<script src="merge_board_landscape_array.js"></script>
	<script src="merge_fog_on_board_array.js"></script>
	<script src="merge_events_array.js"></script>
	<script src="merge_set_item_for_new_geme_array.js"></script>

	<script src="merge_Game_class.js"></script>

	<script src="merge_Board_class.js"></script>
	<script src="merge_BoardRendererCanvas_class.js"></script>

	<script src="merge_Fog_class.js"></script>
	<script src="merge_FogRendererCanvas_class.js"></script>

	<script src="merge_ItemRegistry_class.js"></script>
	<script src="merge_ItemPlacer_class.js"></script>
	<script src="merge_ItemHandler_class.js"></script>

	<script src="merge_Item_class.js"></script>
	<script src="merge_ItemRendererCanvas_class.js"></script>
	<script src="merge_ItemEffectRenderer_class.js"></script>

	<script src="merge_MagicWayRendererCanvas_class.js"></script>

	<script src="merge_GiftFromItem_class.js"></script>
	<script src="merge_GiftOnItem_class.js"></script>
	<script src="merge_GiftFromClickOnItem_class.js"></script>

	<script src="merge_MergeManager_class.js"></script>

	<script src="merge_DragManager_classes.js"></script>
	<script src="merge_DragStrategy_classes.js"></script>

	<script src="merge_FlyItemsManager_class.js"></script>
	<script src="merge_FlyItem_class.js"></script>

	<script src="merge_FlyerManager_class.js"></script>
	<script src="merge_Flyer_class.js"></script>
	<script src="merge_FlyersAnimation_class.js"></script>
	<script src="merge_FlyerRendererCanvas_class.js"></script>
	<script src="merge_FlyersGalleryManager_class.js"></script>

	<script src="merge_SaveData_class.js"></script>

	<script src="merge_GameOptions_class.js"></script>
	<script src="merge_Resources_class.js"></script>
	<script src="merge_ShopManager_class.js"></script>
	<script src="merge_ShopRenderer_class.js"></script>
	<script src="merge_ItemInfoPanel_class.js"></script>

</body>
</html>
